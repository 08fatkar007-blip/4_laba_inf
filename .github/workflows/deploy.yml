## Workflow: проверка HTML (линтинг) и автоматическая публикация сайта на GitHub Pages.
name: Deploy static site

# Триггер: запуск при каждом push в ветку main
on:
  push:
    branches: [ main ]

# Права, необходимые для публикации на GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # Задание 1. Проверка качества HTML-кода
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Lint HTML (htmlhint)
        run: npx --yes htmlhint index.html

  # Задание 2. Публикация сайта (только если lint прошёл успешно)
  deploy:
    needs: lint
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
